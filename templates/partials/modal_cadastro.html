<div class="modal fade" id="{{ id }}" tabindex="-1" aria-labelledby="{{ id }}-titulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable {{ tamanho }}">
    <form class="modal-content" method="post" action="{{ url }}" novalidate
          data-cadastro-rapido="{{ tipo }}" data-prefixo="{{ form.prefix }}">
      {% csrf_token %}
      <div class="modal-header">
        <h2 class="modal-title h5" id="{{ id }}-titulo">{{ titulo }}</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger d-none" data-erro-geral></div>
        {% include campos %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Cadastrar</button>
      </div>
    </form>
  </div>
</div>
