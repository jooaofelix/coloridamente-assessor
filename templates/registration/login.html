{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Assessor Coloridamente</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/assessor.css' %}">
</head>
<body class="pagina-login">
  <div class="faixa-colorida" aria-hidden="true"></div>
  <main class="container">
    <div class="card cartao-login mx-auto">
      <div class="card-body p-4">
        <img class="logo-login" src="{% static 'brand/logo-coloridamente.svg' %}" alt="Coloridamente" width="168" height="68">
        <h1 class="h4 mt-3 mb-1">Assessor</h1>
        <p class="text-body-secondary mb-4">Entre para registrar vendas, clientes e produtos.</p>

        {% if form.errors %}
          <div class="alert alert-danger py-2">Usuário ou senha incorretos.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="id_username">Usuário</label>
            <input class="form-control" type="text" name="username" id="id_username"
                   value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="id_password">Senha</label>
            <input class="form-control" type="password" name="password" id="id_password"
                   autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
