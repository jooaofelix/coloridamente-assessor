<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova venda · Assessor Coloridamente</title>
<link rel="preload" href="vendor/lato/lato-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/assessor.css">
</head>
<body>
<header id="cabecalho" data-aba="vendas"></header>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/layout.js"></script>

<main class="container py-4">
<nav aria-label="Caminho">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="vendas.html">Vendas</a></li>
    <li class="breadcrumb-item active" aria-current="page" data-titulo>Nova venda</li>
  </ol>
</nav>

<div class="cabecalho-pagina tema-vendas">
  <h1 class="h3 mb-0" data-titulo>Nova venda</h1>
</div>

<form id="form-venda" novalidate>
  <div class="card mb-3">
    <div class="card-body">
      <h2 class="rotulo-secao">Atendimento</h2>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="venda-cliente">Cliente <span class="text-danger" title="obrigatório">*</span></label>
          <div class="input-group">
            <select class="form-select" id="venda-cliente" name="clienteId">
              <option value="">Carregando…</option>
            </select>
            <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modal-novo-cliente">
              <i class="bi bi-person-plus" aria-hidden="true"></i> <span class="d-none d-sm-inline">Cadastrar cliente</span><span class="d-sm-none">Novo</span>
            </button>
          </div>
        </div>
        <div class="col-sm-6 col-md-3">
          <label class="form-label" for="venda-data">Data <span class="text-danger" title="obrigatório">*</span></label>
          <input class="form-control" type="date" id="venda-data" name="data">
        </div>
        <div class="col-sm-6 col-md-3">
          <label class="form-label" for="venda-pagamento">Forma de pagamento</label>
          <select class="form-select" id="venda-pagamento" name="formaPagamento"></select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="venda-ocasiao">Ocasião</label>
          <select class="form-select" id="venda-ocasiao" name="ocasiao"></select>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="rotulo-secao">Produtos vendidos</h2>
      <div class="alert alert-danger py-2 d-none" id="erro-itens" role="alert"></div>

      <div class="row g-2 cabecalho-itens d-none d-md-flex" aria-hidden="true">
        <div class="col-md-5">Produto</div>
        <div class="col-md-2">Quantidade</div>
        <div class="col-md-2">Valor unit. (R$)</div>
        <div class="col-md-2 text-end">Subtotal</div>
        <div class="col-md-1"></div>
      </div>

      <div id="itens"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3 pt-3 border-top">
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-outline-primary" id="adicionar-item">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> Adicionar produto
          </button>
          <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modal-novo-produto">
            <i class="bi bi-box-seam" aria-hidden="true"></i> Cadastrar produto
          </button>
        </div>
        <div class="total-venda">Total: <strong id="total" aria-live="polite">R$ 0,00</strong></div>
      </div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <label class="form-label" for="venda-observacoes">Observações do atendimento</label>
      <textarea class="form-control" id="venda-observacoes" name="observacoes" rows="3"
                placeholder="Como foi o atendimento, personalização combinada, prazos…"></textarea>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg" aria-hidden="true"></i> Salvar venda</button>
    <a class="btn btn-outline-secondary" href="vendas.html" id="cancelar">Cancelar</a>
  </div>
</form>
</main>
<div class="modal fade" id="modal-novo-cliente" tabindex="-1" aria-labelledby="modal-novo-cliente-titulo" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="form-novo-cliente" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="modal-novo-cliente-titulo">Cadastrar cliente</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body" data-campos></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg" aria-hidden="true"></i> Cadastrar</button>
      </div>
    </form>
  </div>
</div>

<div class="modal fade" id="modal-novo-produto" tabindex="-1" aria-labelledby="modal-novo-produto-titulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="form-novo-produto" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="modal-novo-produto-titulo">Cadastrar produto</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body" data-campos></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg" aria-hidden="true"></i> Cadastrar</button>
      </div>
    </form>
  </div>
</div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/banco.js"></script>
<script src="js/clientes-store.js"></script>
<script src="js/produtos-store.js"></script>
<script src="js/vendas-store.js"></script>
<script src="js/formularios.js"></script>
<script src="js/app-venda-form.js"></script>
</body>
</html>
