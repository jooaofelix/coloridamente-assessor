<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início · Assessor Coloridamente</title>
<link rel="preload" href="vendor/lato/lato-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/assessor.css">
</head>
<body>
<header id="cabecalho" data-aba="inicio"></header>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/layout.js"></script>

<main class="container py-4">
<div class="cabecalho-pagina tema-inicio">
  <div>
    <h1 class="h3 mb-0" id="saudacao">Olá!</h1>
    <p class="text-body-secondary mb-0" id="hoje"></p>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-primary" href="venda-form.html"><i class="bi bi-bag-plus" aria-hidden="true"></i> Nova venda</a>
    <a class="btn btn-outline-primary" href="cliente-form.html"><i class="bi bi-person-plus" aria-hidden="true"></i> Novo cliente</a>
    <a class="btn btn-outline-primary" href="produto-form.html"><i class="bi bi-box-seam" aria-hidden="true"></i> Novo produto</a>
  </div>
</div>

<div class="row g-3 mb-4">
  <div class="col-sm-4">
    <a class="card indicador tema-clientes h-100" href="clientes.html">
      <div class="card-body">
        <span class="rotulo">Clientes cadastrados</span>
        <span class="valor" id="total-clientes">–</span>
      </div>
    </a>
  </div>
  <div class="col-sm-4">
    <a class="card indicador tema-vendas h-100" href="vendas.html">
      <div class="card-body">
        <span class="rotulo">Vendas em <span data-mes></span></span>
        <span class="valor" id="vendas-do-mes">–</span>
      </div>
    </a>
  </div>
  <div class="col-sm-4">
    <div class="card indicador tema-faturamento h-100">
      <div class="card-body">
        <span class="rotulo">Faturamento em <span data-mes></span></span>
        <span class="valor" id="faturamento-do-mes">–</span>
      </div>
    </div>
  </div>
</div>

<div class="row g-4">
  <div class="col-lg-5">
    <div class="card h-100">
      <div class="card-body">
        <h2 class="rotulo-secao">Aniversariantes de <span data-mes></span></h2>
        <div id="aniversariantes"><div class="vazio vazio-compacto" data-carregando><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Carregando…</div></div>
      </div>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-baseline mb-3">
          <h2 class="rotulo-secao mb-0">Últimas vendas</h2>
          <a class="small" href="vendas.html">Ver todas</a>
        </div>
        <div id="ultimas-vendas"><div class="vazio vazio-compacto" data-carregando><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Carregando…</div></div>
      </div>
    </div>
  </div>
</div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/banco.js"></script>
<script src="js/clientes-store.js"></script>
<script src="js/produtos-store.js"></script>
<script src="js/vendas-store.js"></script>
<script src="js/app-inicio.js"></script>
</body>
</html>
